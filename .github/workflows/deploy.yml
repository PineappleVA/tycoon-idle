name: Desplegar en GitHub Pages

# Se dispara al fusionar en main (o a mano desde la pestaña Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # OJO: "administration" NO es una clave válida aquí (el run 37360404732 falló
  # en 0 s por eso). El GITHUB_TOKEN no puede crear el sitio Pages, así que
  # hace falta activarlo una vez a mano: Settings -> Pages -> Source: GitHub
  # Actions. A partir de ahí este workflow funciona solo.

# Un solo despliegue a la vez; si llega otro, se cancela el anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # No se publica nada que no pase tipos, tests y build.
      - name: Comprobaciones
        run: npm run check

      - name: Construir
        run: npm run build

      # enablement: true activa Pages por nosotros la primera vez (build type
      # "workflow"). Sin esto la acción falla con "Get Pages site failed" hasta
      # que alguien entra en Settings -> Pages a elegir GitHub Actions a mano.
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
